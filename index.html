!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nazimvodeo.com - Video Dekho</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff}
header{display:flex;align-items:center;padding:12px;background:#000;position:sticky;top:0}
.logo{font-size:22px;font-weight:900}.logo span{color:red}
#searchBox{flex:1;margin:0 15px;padding:8px 15px;border-radius:20px;border:1px solid #333;background:#121212;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:15px}
.card{background:#1a1a1a;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:110px;object-fit:cover}
.card h4{font-size:13px;padding:8px;height:38px;overflow:hidden}
.card p{font-size:11px;color:#aaa;padding:0 8px 8px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000c;z-index:99;justify-content:center;align-items:center}
.modal-content{width:95%;max-width:600px;background:#111;padding:15px;border-radius:10px}
.modal-content video{width:100%;border-radius:8px}
.close{float:right;font-size:28px;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="logo">Nazim<span>vodeo</span>.com</div>
<input id="searchBox" placeholder="Search video...">
</header>
<div class="grid" id="grid"></div>
<div id="modal" class="modal"><div class="modal-content"><span class="close" onclick="document.getElementById('modal').style.display='none'">×</span><video id="player" controls></video><h3 id="vTitle" style="margin-top:10px"></h3></div></div>
<script>
const videos=[
{title:"Beby Channel New Comedy 2026",views:"1.2M",thumb:"https://picsum.photos/seed/1/300/200",src:"https://www.w3schools.com/html/mov_bbb.mp4"},
{title:"Nazimvodeo Viral Song",views:"850K",thumb:"https://picsum.photos/seed/2/300/200",src:"https://www.w3schools.com/html/movie.mp4"},
{title:"Bareilly Vlog - Desi Style",views:"2M",thumb:"https://picsum.photos/seed/3/300/200",src:"https://www.w3schools.com/html/mov_bbb.mp4"},
{title:"Funny Beby Video",views:"500K",thumb:"https://picsum.photos/seed/4/300/200",src:"https://www.w3schools.com/html/mov_bbb.mp4"},
{title:"Nazimvodeo.com Launch",views:"10K",thumb:"https://picsum.photos/seed/5/300/200",src:"https://www.w3schools.com/html/mov_bbb.mp4"},
{title:"Trending Bhojpuri 2026",views:"3M",thumb:"https://picsum.photos/seed/6/300/200",src:"https://www.w3schools.com/html/mov_bbb.mp4"},
];
const grid=document.getElementById('grid');
function show(list){grid.innerHTML='';list.forEach(v=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${v.thumb}"><h4>${v.title}</h4><p>${v.views} views</p>`;d.onclick=()=>{document.getElementById('modal').style.display='flex';document.getElementById('player').src=v.src;document.getElementById('vTitle').innerText=v.title;document.getElementById('player').play();};grid.appendChild(d);});}
document.getElementById('searchBox').addEventListener('input',e=>{let q=e.target.value.toLowerCase();show(videos.filter(v=>v.title.toLowerCase().includes(q)));});
show(videos);
</script>
</body>
</html>
